name: Build Installers

on:
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Build Windows Installer with Velopack
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        # Handle branch names vs tags
        if ($version -eq "develop" -or $version -eq "refs/heads/develop" -or $version.StartsWith("refs/heads/")) {
          $version = "0.0.0-preview"
        }
        ./scripts/packaging/build-windows-installer.ps1 -Version $version
      env:
        VERSION: ${{ github.ref_name }}

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: tvnoms-proxy-windows-installer
        path: publish/packages/*.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Linux
      run: dotnet publish proxy/tvnoms-proxy.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/linux

    - name: Publish Tray
      run: dotnet publish tray/tvnoms-tray.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/linux

    - name: Remove Development Configuration
      run: rm -f ./publish/linux/appsettings.Development.json

    - name: Install nfpm
      run: |
        NFPM_VERSION="2.43.4"
        wget -qO /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
        sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
        sudo chmod +x /usr/local/bin/nfpm
        nfpm --version
      shell: bash

    - name: Stage Linux release artifacts
      run: |
        # User systemd unit — shipped at /usr/lib/systemd/user/tvnoms-proxy.service
        # by the distro packages, also bundled in the tarball for AUR consumption.
        cat > ./publish/linux/tvnoms-proxy.service << 'EOF'
        [Unit]
        Description=Tvnoms Proxy Service
        Documentation=https://github.com/tvnoms/tvnoms-proxy
        After=network-online.target
        Wants=network-online.target tvnoms-tray.service

        [Service]
        Type=notify
        ExecStart=/usr/bin/tvnoms-proxy
        Restart=on-failure
        RestartSec=5
        Environment=ASPNETCORE_ENVIRONMENT=Production
        Environment=DOTNET_PRINT_TELEMETRY_MESSAGE=false

        [Install]
        WantedBy=default.target
        EOF

        # Tray icon user unit — shipped at /usr/lib/systemd/user/tvnoms-tray.service. The proxy
        # Wants= it (so starting the proxy starts the tray), but the tray is deliberately NOT PartOf=
        # or Requisite= on the proxy: it stays up while the proxy is stopped so its menu can start
        # the proxy again.
        cat > ./publish/linux/tvnoms-tray.service << 'EOF'
        [Unit]
        Description=Tvnoms Tray
        Documentation=https://github.com/tvnoms/tvnoms-proxy
        PartOf=graphical-session.target
        After=tvnoms-proxy.service graphical-session.target
        # The proxy can start before the desktop session has exported its display to the user
        # manager. Skip cleanly (rather than crash-loop) when there is no display; the
        # graphical-session.target.wants link shipped alongside this unit starts us once the
        # session is up.
        ConditionEnvironment=|WAYLAND_DISPLAY
        ConditionEnvironment=|DISPLAY

        [Service]
        ExecStart=/usr/bin/tvnoms-tray
        Restart=on-failure
        RestartSec=5
        Environment=DOTNET_PRINT_TELEMETRY_MESSAGE=false
        EOF

        # Minimal README bundled into the tarball for AUR's makepkg source.
        cat > ./publish/linux/README.md << 'EOF'
        # Tvnoms Proxy

        Per-user systemd service. Install via your distro package
        (`pacman -S tvnoms-proxy`, `apt install ./tvnoms-proxy*.deb`,
        `rpm -i tvnoms-proxy*.rpm`), then:

        ```
        systemctl --user enable --now tvnoms-proxy
        ```

        Config is created at `~/.config/tvnoms-proxy/appsettings.json` on first
        run. A reference template is installed to
        `/usr/share/tvnoms-proxy/appsettings.json.example`.

        A notification-area icon (`tvnoms-tray`) showing recording status is
        installed alongside the service. It is a systemd user unit tied to the
        proxy: it starts and stops with `tvnoms-proxy` (whenever a graphical
        session is available), so there is nothing extra to enable.
        EOF

        chmod +x ./publish/linux/tvnoms-proxy
        chmod +x ./publish/linux/tvnoms-tray

    - name: Build Distribution Packages
      run: |
        cd scripts/packaging
        chmod +x build-packages.sh scripts/*.sh
        ./build-packages.sh
      env:
        VERSION: ${{ github.ref_name }}

    - name: Create Linux TAR package
      run: |
        cd ./publish/linux
        tar -czf ../../tvnoms-proxy-linux.tar.gz *

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tvnoms-proxy-linux
        path: ./tvnoms-proxy-linux.tar.gz

    - name: Upload DEB Package
      uses: actions/upload-artifact@v4
      with:
        name: tvnoms-proxy-deb
        path: ./publish/packages/*.deb

    - name: Upload RPM Package
      uses: actions/upload-artifact@v4
      with:
        name: tvnoms-proxy-rpm
        path: ./publish/packages/*.rpm

    - name: Upload Arch Package
      uses: actions/upload-artifact@v4
      with:
        name: tvnoms-proxy-arch
        path: ./publish/packages/*.pkg.tar.zst

    - name: Push to AUR
      if: github.event_name == 'release' && !contains(github.ref_name, 'preview')
      run: |
        # Setup SSH for AUR
        mkdir -p ~/.ssh
        echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
        chmod 600 ~/.ssh/aur
        
        # Configure SSH for AUR
        cat >> ~/.ssh/config << 'EOF'
        Host aur.archlinux.org
          IdentityFile ~/.ssh/aur
          User aur
          StrictHostKeyChecking no
          BatchMode yes
          IdentitiesOnly yes
        EOF
        
        chmod 600 ~/.ssh/config
        
        # Push to AUR
        cd scripts/packaging
        chmod +x push-to-aur.sh
        ./push-to-aur.sh
      env:
        VERSION: ${{ github.ref_name }}
        GIT_SSH_COMMAND: "ssh -o BatchMode=yes -o StrictHostKeyChecking=no"

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
    - name: Download Windows Installer
      uses: actions/download-artifact@v4
      with:
        name: tvnoms-proxy-windows-installer
        path: ./artifacts/windows

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: tvnoms-proxy-linux
        path: ./artifacts/linux

    - name: Download DEB Package
      uses: actions/download-artifact@v4
      with:
        name: tvnoms-proxy-deb
        path: ./artifacts/deb

    - name: Download RPM Package
      uses: actions/download-artifact@v4
      with:
        name: tvnoms-proxy-rpm
        path: ./artifacts/rpm

    - name: Download Arch Package
      uses: actions/download-artifact@v4
      with:
        name: tvnoms-proxy-arch
        path: ./artifacts/arch

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./artifacts/windows/*.exe
          ./artifacts/linux/*.tar.gz
          ./artifacts/deb/*.deb
          ./artifacts/rpm/*.rpm
          ./artifacts/arch/*.pkg.tar.zst
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
